        <p>
          GokBall, tarayıcıda çalışan gerçek zamanlı çok oyunculu bir futbol oyunudur. Bir oda oluşturur,
          arkadaşlarınla aynı odaya katılır, kırmızı ve mavi takımlara ayrılırsın; oklar/WASD ile oyuncunu

          forma seçimi ve özelleştirilebilir tuş atamaları da dahildir.
        </p>
